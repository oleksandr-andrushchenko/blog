name: ${PROJECT_NAME:-blog}-tests

services:
  web-lambda:
    build:
      context: ./
      dockerfile: web-lambda/Dockerfile
    ports:
      - "${WEB_LAMBDA_PORT}:5000"
    env_file:
      - .env
      - ${TEST_ENV_FILE:-.env.test}
    environment:
      TEST_EXTERNAL_CALL_LOG: "/test-audit/external-calls.jsonl"
      APP_STAGE: local
      FACEBOOK_PAGE_APP_ID: ""
      FACEBOOK_PAGE_APP_SECRET: ""
      FACEBOOK_PAGE_TOKEN_ENCRYPTION_KEY: ""
      FACEBOOK_PAGE_API_VERSION: "v27.0"
      FACEBOOK_PAGE_PUBLISHER_ENABLED: "false"
      PINTEREST_APP_ID: ""
      PINTEREST_APP_SECRET: ""
      PINTEREST_TOKEN_ENCRYPTION_KEY: ""
      PINTEREST_PUBLISHER_ENABLED: "false"
      SITE_TELEGRAM_CHANNEL_URL: ""
      SITE_THREADS_PROFILE_URL: ""
      SITE_PINTEREST_PROFILE_URL: ""
      LINKEDIN_APP_ID: ""
      LINKEDIN_APP_SECRET: ""
      LINKEDIN_TOKEN_ENCRYPTION_KEY: ""
      LINKEDIN_API_VERSION: "202610"
      THREADS_APP_ID: ""
      THREADS_APP_SECRET: ""
      THREADS_TOKEN_ENCRYPTION_KEY: ""
      BACKGROUND_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_ENABLED: "false"
      THREADS_PUBLISHER_ENABLED: "false"
      LINKEDIN_PUBLISHER_ENABLED: "false"
      FACEBOOK_CREDENTIALS_SECRET_ARN: ""
      SITEMAP_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_BOT_TOKEN: ""
      TELEGRAM_PUBLISHER_WEBHOOK_SECRET: ""
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-app-secret
      AUTH_JWT_SECRET: test-auth-jwt-secret
      WEB_BASE_URL: "http://web-lambda:5000"
      API_BASE_URL: "http://api-lambda:5000"
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app_test
      EMAIL_FILES_DIR: "/app-emails"
      STATIC_FILES_DIR: "/app-static"
      TEST_SERVICE_NAME: web-lambda
      PYTHONPATH: "/test-support:/app:/web-lambda"
      FUNCTION_TEMPLATES_DIR: "/web-lambda/templates"
    volumes:
      - ./tests/support:/test-support:ro
      - ./.tmp/test-audit:/test-audit
      - ./shared:/app
      - ./tests/site-config.json:/app/data.json:ro
      - ./web-lambda:/web-lambda
      - ./.media-originals:/app-media-originals
      - ./static:/app-static
      - ./static:/app/static
      - ./.emails:/app-emails
      - ./.emails:/app/.emails

  api-lambda:
    build:
      context: ./
      dockerfile: api-lambda/Dockerfile
    ports:
      - "${API_LAMBDA_PORT}:5000"
    env_file:
      - .env
      - ${TEST_ENV_FILE:-.env.test}
    environment:
      TEST_EXTERNAL_CALL_LOG: "/test-audit/external-calls.jsonl"
      APP_STAGE: local
      FACEBOOK_PAGE_APP_ID: ""
      FACEBOOK_PAGE_APP_SECRET: ""
      FACEBOOK_PAGE_TOKEN_ENCRYPTION_KEY: ""
      FACEBOOK_PAGE_API_VERSION: "v27.0"
      FACEBOOK_PAGE_PUBLISHER_ENABLED: "false"
      PINTEREST_APP_ID: ""
      PINTEREST_APP_SECRET: ""
      PINTEREST_TOKEN_ENCRYPTION_KEY: ""
      PINTEREST_PUBLISHER_ENABLED: "false"
      SITE_TELEGRAM_CHANNEL_URL: ""
      SITE_THREADS_PROFILE_URL: ""
      SITE_PINTEREST_PROFILE_URL: ""
      LINKEDIN_APP_ID: ""
      LINKEDIN_APP_SECRET: ""
      LINKEDIN_TOKEN_ENCRYPTION_KEY: ""
      LINKEDIN_API_VERSION: "202610"
      THREADS_APP_ID: ""
      THREADS_APP_SECRET: ""
      THREADS_TOKEN_ENCRYPTION_KEY: ""
      BACKGROUND_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_ENABLED: "false"
      THREADS_PUBLISHER_ENABLED: "false"
      LINKEDIN_PUBLISHER_ENABLED: "false"
      FACEBOOK_CREDENTIALS_SECRET_ARN: ""
      SITEMAP_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_BOT_TOKEN: ""
      TELEGRAM_PUBLISHER_WEBHOOK_SECRET: ""
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: test-app-secret
      AUTH_JWT_SECRET: test-auth-jwt-secret
      API_BASE_URL: "http://api-lambda:5000"
      WEB_BASE_URL: "http://web-lambda:5000"
      ALLOWED_ORIGIN: "http://web-lambda:5000"
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app_test
      EMAIL_FILES_DIR: "/app-emails"
      STATIC_FILES_DIR: "/app-static"
      TEST_SERVICE_NAME: api-lambda
      PYTHONPATH: "/test-support:/app:/api-lambda"
      FUNCTION_TEMPLATES_DIR: "/api-lambda/templates"
    volumes:
      - ./tests/support:/test-support:ro
      - ./.tmp/test-audit:/test-audit
      - ./shared:/app
      - ./tests/site-config.json:/app/data.json:ro
      - ./api-lambda:/api-lambda
      - ./.media-originals:/app-media-originals
      - ./static:/app-static
      - ./static:/app/static
      - ./.emails:/app-emails
      - ./.emails:/app/.emails

  tests:
    build:
      context: ./
      dockerfile: tests/Dockerfile
    command: [ "tail", "-f", "/dev/null" ]
    depends_on:
      - dynamodb
    env_file:
      - .env
      - ${TEST_ENV_FILE:-.env.test}
    environment:
      TEST_EXTERNAL_CALL_LOG: "/test-audit/external-calls.jsonl"
      TEST_SERVICE_NAME: tests
      PYTHONPATH: "/test-support:/tests:/scripts"
      WEB_TEST_BASE_URL: "http://web-lambda:5000"
      API_TEST_BASE_URL: "http://api-lambda:5000"
      TEST_DYNAMODB_TABLE: app_test
      DYNAMODB_TABLE: app_test
      PROJECT_ROOT: "/project"
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      FACEBOOK_PAGE_APP_ID: ""
      FACEBOOK_PAGE_APP_SECRET: ""
      FACEBOOK_PAGE_TOKEN_ENCRYPTION_KEY: ""
      FACEBOOK_PAGE_API_VERSION: "v27.0"
      FACEBOOK_PAGE_PUBLISHER_ENABLED: "false"
      PINTEREST_APP_ID: ""
      PINTEREST_APP_SECRET: ""
      PINTEREST_TOKEN_ENCRYPTION_KEY: ""
      PINTEREST_PUBLISHER_ENABLED: "false"
      SITE_TELEGRAM_CHANNEL_URL: ""
      SITE_THREADS_PROFILE_URL: ""
      SITE_PINTEREST_PROFILE_URL: ""
      LINKEDIN_APP_ID: ""
      LINKEDIN_APP_SECRET: ""
      LINKEDIN_TOKEN_ENCRYPTION_KEY: ""
      LINKEDIN_API_VERSION: "202610"
      THREADS_APP_ID: ""
      THREADS_APP_SECRET: ""
      THREADS_TOKEN_ENCRYPTION_KEY: ""
      BACKGROUND_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_ENABLED: "false"
      THREADS_PUBLISHER_ENABLED: "false"
      LINKEDIN_PUBLISHER_ENABLED: "false"
      FACEBOOK_CREDENTIALS_SECRET_ARN: ""
      SITEMAP_FUNCTION_NAME: ""
      TELEGRAM_PUBLISHER_BOT_TOKEN: ""
      TELEGRAM_PUBLISHER_WEBHOOK_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    volumes:
      - ./tests/support:/test-support:ro
      - ./.tmp/test-audit:/test-audit
      - ./tests:/tests
      - ./:/project
      - ./tests/site-config.json:/project/shared/data.json:ro
      - ./scripts:/scripts
      - ./static:/app/static
      - ./.emails:/app/.emails

  dynamodb:
    image: amazon/dynamodb-local
    user: root
    ports:
      - "${DYNAMODB_PORT}:8000"
    volumes:
      - dynamodb-test-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"

volumes:
  dynamodb-test-data:

networks:
  default:
    internal: true
