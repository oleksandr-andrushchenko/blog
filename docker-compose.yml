services:
  be-function:
    build:
      context: ./
      dockerfile: Dockerfile-be-func
    ports:
      - "${BE_FUNCTION_PORT}:5000"
    env_file:
      - .env
    environment:
      APP_STAGE: local
      APP_ENV: dev
      APP_DEBUG: 1
      BASE_URL: "http://localhost:${BE_FUNCTION_PORT}"
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app
      GOOGLE_ANALYTICS_ID: ""
      TINYMCE_API_KEY: ""
      CONTACT_TOPIC_ARN: ""
    volumes:
      - ./be-function-src:/app

  be-function-test:
    build:
      context: ./
      dockerfile: Dockerfile-be-func
    ports:
      - "${TEST_BE_FUNCTION_PORT}:5000"
    env_file:
      - .env
    environment:
      APP_STAGE: local
      APP_ENV: test
      APP_DEBUG: 1
      BASE_URL: "http://localhost:${TEST_BE_FUNCTION_PORT}"
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app_test
    volumes:
      - ./be-function-src:/app

  dynamodb:
    image: amazon/dynamodb-local
    user: root
    ports:
      - "${DYNAMODB_PORT}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"

  scripts:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TEST_BASE_URL: "http://be-function-test:5000"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      TEST_DYNAMODB_TABLE: app_test
    volumes:
      - ./:/app

volumes:
  dynamodb-data: