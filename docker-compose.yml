services:
  web-lambda:
    build:
      context: ./
      dockerfile: web-lambda/Dockerfile
    ports:
      - "${WEB_LAMBDA_PORT}:5000"
    env_file:
      - .env
    environment:
      APP_STAGE: local
      APP_ENV: dev
      APP_DEBUG: 1
      WEB_BASE_URL: "http://localhost:${WEB_LAMBDA_PORT}"
      API_BASE_URL: "http://localhost:${API_LAMBDA_PORT}"
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app
      GOOGLE_ANALYTICS_ID: ""
      TINYMCE_API_KEY: ""
      CONTACT_TOPIC_ARN: ""
      EMAIL_FILES_DIR: "/app-emails"
      STATIC_FILES_DIR: "/app-static"
      PYTHONPATH: "/app:/web-lambda"
      FUNCTION_TEMPLATES_DIR: "/web-lambda/templates"
    volumes:
      - ./shared:/app
      - ./web-lambda:/web-lambda
      - ./static:/app-static
      - ./.emails:/app-emails

  api-lambda:
    build:
      context: ./
      dockerfile: api-lambda/Dockerfile
    ports:
      - "${API_LAMBDA_PORT}:5000"
    env_file:
      - .env
    environment:
      APP_STAGE: local
      APP_ENV: dev
      APP_DEBUG: 1
      API_BASE_URL: "http://localhost:${API_LAMBDA_PORT}"
      WEB_BASE_URL: "http://localhost:${WEB_LAMBDA_PORT}"
      ALLOWED_ORIGIN: "http://localhost:${WEB_LAMBDA_PORT}"
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: app
      GOOGLE_ANALYTICS_ID: ""
      TINYMCE_API_KEY: ""
      CONTACT_TOPIC_ARN: ""
      EMAIL_FILES_DIR: "/app-emails"
      STATIC_FILES_DIR: "/app-static"
      PYTHONPATH: "/app:/api-lambda"
      FUNCTION_TEMPLATES_DIR: "/api-lambda/templates"
    volumes:
      - ./shared:/app
      - ./api-lambda:/api-lambda
      - ./static:/app-static
      - ./.emails:/app-emails

  dynamodb:
    image: amazon/dynamodb-local
    user: root
    ports:
      - "${DYNAMODB_PORT}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"


volumes:
  dynamodb-data: