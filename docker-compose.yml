services:
  be-function:
    build:
      context: ./
      dockerfile: Dockerfile-be-function
    ports:
      - "${BE_FUNCTION_PORT}:5000"
    env_file:
      - .env
    environment:
      ENV: local
      BASE_URL: "http://localhost:${BE_FUNCTION_PORT}"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
    volumes:
      - ./be-function-src:/app
      - ./.env:/.env

  be-function-test:
    build:
      context: ./
      dockerfile: Dockerfile-be-function
    ports:
      - "${TEST_BE_FUNCTION_PORT}:5000"
    env_file:
      - .env
    environment:
      ENV: test
      BASE_URL: "http://localhost:${TEST_BE_FUNCTION_PORT}"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: ${TEST_DYNAMODB_TABLE}
    volumes:
      - ./be-function-src:/app
      - ./.env:/.env

  dynamodb:
    image: amazon/dynamodb-local
    user: root
    ports:
      - "${DYNAMODB_PORT}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"

  scripts:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TEST_BASE_URL: "http://be-function-test:5000"
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
    volumes:
      - ./:/app

volumes:
  dynamodb-data: