{% if article_query.tags %}
    <section class="card shadow-sm text-bg-light tag-subscription-block"
             data-tag-subscription-id="{{ tag_subscription.id if tag_subscription else '' }}">
        <div class="card-body">
            <h2 class="h4 card-title">
                <i class="bi bi-bell"></i>
                Interested in {{ article_query.tags | join(' and ') }} articles?
            </h2>

            <p class="card-text">
                Subscribe and don’t miss new content.
            </p>

            {% if cur_user %}
                {% if tag_subscription %}
                    <button class="btn btn-success btn-sm btn-tag-subscription" type="button"
                            data-tag-subscription-id="{{ tag_subscription.id }}">
                        <i class="bi bi-bell"></i>
                        Subscribed
                    </button>
                {% else %}
                    <button class="btn btn-outline-success btn-sm btn-tag-subscription" type="button"
                            data-tags='{{ article_query.tags | tojson }}'>
                        <i class="bi bi-bell"></i>
                        Subscribe
                    </button>
                {% endif %}
            {% else %}
                <a class="btn btn-dark btn-sm"
                   href="{{ url('login', redirect_url=request.url.path ~ ("?" ~ request.url.query if request.url.query else "")) }}">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign in to subscribe
                </a>
            {% endif %}
        </div>
    </section>
{% endif %}
