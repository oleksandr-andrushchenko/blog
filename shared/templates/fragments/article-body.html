<div class="card-body">
    <a class="link-body-emphasis text-decoration-none" href="{{ article_url(article) }}">
        <h{{ h_tag_size }} class="h{{ h_display_size | default(5) }} mb-1 card-title">
            {{ article.title }}
        </h{{ h_tag_size }}>

        {% if preview %}
            <div class="card-text mb-1 text-secondary two-line-ellipsis">
                {{ article.preview }}
            </div>
        {% endif %}
    </a>

    <div class="mt-2 mb-3">
        {% include "fragments/article-rating.html" %}
    </div>
    {% include "fragments/article-badges.html" %}
    {% include "fragments/article-meta.html" %}
</div>
