<form id="article-comment-form" novalidate>
    <div class="form-group">
        <label class="w-100">
            <textarea class="form-control" id="text" name="text" placeholder="Write a comment"
                      rows="3">{{ article_comment.text if article_comment else "" }}</textarea>
        </label>
    </div>

    <button type="submit" class="btn btn-outline-dark btn-sm">
        <i class="bi {% if article_comment %}bi-arrow-clockwise{% else %}bi-plus-lg{% endif %}"></i>
        {% if article_comment %}Update{% else %}Add{% endif %} comment
    </button>
</form>

<script src="{{ static_url('comment-draft.js', _=js_cache_counter) }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    {% set form_url = url('update-article-comment', article_id=article.id, comment_id=article_comment.id, absolute=True) if article_comment
    else url('create-article-comment', article_id=article.id, absolute=True) %}
    const draft = commentDraftStore({{ article.id | tojson }})
    const field = document.querySelector("#article-comment-form [name=text]")
    {% if not article_comment %}
    draft.load().then(saved => {
      if (saved && !field.value) field.value = saved.text
    }).catch(() => {})
    {% endif %}
    handleFormSubmit("#article-comment-form", {{ form_url | tojson }}, {
      authRequired: false,
      beforeSubmit: async data => {
        if (window.CONFIG.current_user) return
        await draft.save(data.text, [])
        window.location.assign({{ url('login', redirect_url=article_url(article) ~ '#article-comment-form') | tojson }})
        return false
      },
      method: "{{ 'PATCH' if article_comment else 'POST' }}",
      rules: {
        text: [{rule: "required"}, {rule: "minLength", value: 1}, {rule: "maxLength", value: 5_000}],
      },
      onSuccess: async res => {
        try { await draft.remove() } catch (_) { /* A saved comment must still navigate */ }
        if (res) window.location.href = res
      },
    })
  })
</script>
