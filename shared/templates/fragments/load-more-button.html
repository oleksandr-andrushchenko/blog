{% set auto_click = auto_click | default(True) %}

{% if offset %}
    <button class="btn btn-light btn-sm btn-load-more"
            data-limit="{{ limit }}"
            data-offset="{{ offset }}"
            data-url="{{ url }}"
            data-container="{{ container }}"
            {% if auto_click %}data-auto-click{% endif %}
    >Load more
    </button>
{% endif %}
