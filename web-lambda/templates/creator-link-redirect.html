<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Opening {{ link_name }}</title>
</head>
<body>
    <p>Opening {{ link_name }}…</p>
    <noscript><p>Enable JavaScript in your browser, then return and try again.</p></noscript>
    <p><a href="{{ source_url }}" rel="nofollow">Return to the {{ source_label }}</a></p>
    <script>
        window.location.replace({{ destination_url | tojson }});
    </script>
</body>
</html>
