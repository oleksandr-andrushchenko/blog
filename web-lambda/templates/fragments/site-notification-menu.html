<li class="nav-item dropdown" id="site-notifications" data-user-id="{{ cur_user.id }}"
    data-status-url="{{ url('notification-status', absolute=True) }}"
    data-history-url="{{ url('notification-history', absolute=True) }}"
    data-presence-url="{{ url('record-presence', absolute=True) }}"
    data-read-url="{{ url('read-notification', notification_id='notification-id', absolute=True) }}"
    data-unread="{{ cur_user.unread_notifications_count }}" data-revision="{{ cur_user.notifications_revision }}"
    data-last-seen="{{ cur_user.last_seen_at or 0 }}">
    <button class="nav-link dropdown-toggle position-relative" type="button" id="site-notifications-toggle"
            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
            aria-controls="site-notification-menu" aria-label="Notifications, {{ cur_user.unread_notifications_count }} unread">
        <i class="bi bi-bell" aria-hidden="true"></i>
        <span class="badge rounded-pill text-bg-danger" data-unread-notifications aria-hidden="true"
              {% if not cur_user.unread_notifications_count %}hidden{% endif %}>{{ cur_user.unread_notifications_count }}</span>
    </button>
    <div class="dropdown-menu dropdown-menu-end p-2 shadow-sm" id="site-notification-menu"
         aria-labelledby="site-notifications-toggle" style="width: min(24rem, calc(100vw - 2rem));">
        <div class="d-flex justify-content-between align-items-center gap-2 px-2 py-1">
            <strong>Notifications</strong>
            <a class="small" href="{{ url('edit-user', user_id=cur_user.id) }}#notifications">Settings</a>
        </div>
        <div id="site-notification-items" class="my-2" aria-live="polite">
            <p class="small text-body-secondary px-2 mb-0">Open to load notifications.</p>
        </div>
        <a class="btn btn-dark btn-sm w-100" href="{{ url('notification-center') }}">
            <i class="bi bi-bell" aria-hidden="true"></i> All notifications
        </a>
    </div>
</li>
