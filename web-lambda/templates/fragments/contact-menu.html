{% from "fragments/contact-options.html" import contact_options %}
<li class="nav-item dropdown">
    <button class="nav-link dropdown-toggle{% if current_route == 'contacts' %} active{% endif %}"
            type="button" id="contact-menu-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        Contact
    </button>
    <ul class="dropdown-menu" aria-labelledby="contact-menu-toggle">
        {% for label, icon, message in contact_options %}
            <li><a class="dropdown-item" href="{{ url('contacts', message=message) }}#contact-form">
                <i class="bi bi-{{ icon }} me-2" aria-hidden="true"></i>{{ label }}
            </a></li>
        {% endfor %}
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{{ url('contacts') }}">
            <i class="bi bi-question-circle me-2" aria-hidden="true"></i>General inquiry
        </a></li>
    </ul>
</li>
