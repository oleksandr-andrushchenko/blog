{% if contact_socials %}
    <div class="d-flex flex-wrap align-items-center gap-3 {{ social_links_class | default('') }}">
        {% for social in contact_socials %}
            <a href="{{ social.url }}" class="link-dark text-decoration-none d-inline-flex align-items-center gap-1"
               target="_blank" rel="nofollow noopener noreferrer">
                <i class="bi bi-{{ social.icon }}" aria-hidden="true"></i>
                <span>{{ social.name or social.icon | capitalize }}</span>
            </a>
        {% endfor %}
    </div>
{% endif %}
