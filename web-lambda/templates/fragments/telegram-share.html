{% if cur_user and cur_user.has_telegram_integration and cur_user.status == UserStatus.ACTIVE and article.status == ArticleStatus.PUBLISHED %}
    <div class="mt-3">
        <button type="button" class="btn btn-outline-secondary" id="telegram-share">
            <i class="bi bi-telegram me-1" aria-hidden="true"></i>Share to my Telegram channel
        </button>
        <p class="small mt-2 mb-0" id="telegram-share-status" role="status" aria-live="polite"></p>
        <a class="small link-body-emphasis" href="{{ url('edit-user', user_id=cur_user.id) }}#integrations">Manage Telegram connection</a>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById("telegram-share")
        const status = document.getElementById("telegram-share-status")
        button.addEventListener("click", async () => {
          button.disabled = true
          status.textContent = "Sharing to Telegram…"
          try {
            const response = await fetch({{ url('share-article-telegram', article_id=article.id, absolute=True) | tojson }}, {
              method: "POST", credentials: "include", headers: {"Content-Type": "application/json"}, body: "{}"
            })
            const data = await response.json()
            if (!response.ok) throw new Error(typeof data.details === "string" ? data.details : "Could not share this article.")
            status.textContent = `Shared to ${data.channel_title}.`
            // Keep disabled after success to prevent accidental duplicate posts on this page.
          } catch (error) {
            status.textContent = error.message
            button.disabled = false
          }
        })
      })
    </script>
{% endif %}
