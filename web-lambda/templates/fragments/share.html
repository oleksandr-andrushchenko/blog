<div class="share d-flex flex-wrap align-items-center">
    <small class="text-secondary">{{ share_label | default("Share this content") }}:</small>
    <div class="btn-group" role="group" aria-label="Share buttons">
        <a href="#" class="btn btn-light btn-sm share-btn twitter bi bi-twitter" target="_blank" rel="nofollow noopener noreferrer"
           title="Share on Twitter"></a>
        <a href="#" class="btn btn-light btn-sm share-btn facebook bi bi-facebook" target="_blank" rel="nofollow noopener noreferrer"
           title="Share on Facebook"></a>
        <a href="#" class="btn btn-light btn-sm share-btn linkedin bi bi-linkedin" target="_blank" rel="nofollow noopener noreferrer"
           title="Share on LinkedIn"></a>
        <a href="#" class="btn btn-light btn-sm share-btn email bi bi-envelope" target="_blank" rel="nofollow noopener noreferrer"
           title="Share via Email"></a>
    </div>
</div>
