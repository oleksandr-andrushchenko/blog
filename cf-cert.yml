AWSTemplateFormatVersion: '2010-09-09'
Description: ACM Certificate for CloudFront in us-east-1

Parameters:
  Project:
    Type: String
    Description: Logical project identifier (e.g. blog)
  Owner:
    Type: String
    Description: Resource owner (e.g. olek)
  Stage:
    Type: String
    Description: Deployment stage (e.g. local, dev, test, prod, etc.)
    AllowedValues: [ local, dev, test, prod ]
  DomainName:
    Type: String
    Description: The domain name to create a certificate for (e.g. blog.com)
  HostedZoneId:
    Type: String
    Description: The Route53 Hosted Zone ID for the domain

Resources:
  StaticCertificate:
    Type: AWS::CertificateManager::Certificate
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Sub "static.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "static.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Stage
          Value: !Ref Stage
        - Key: Project
          Value: !Ref Project
        - Key: Owner
          Value: !Ref Owner
        - Key: Region
          Value: !Ref AWS::Region

Outputs:
  CertificateArn:
    Description: ARN of the static domain ACM certificate to use in CloudFront
    Value: !Ref StaticCertificate
