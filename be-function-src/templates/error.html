{% extends "layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ code }} - {{ title }}</h1>
    <p class="small text-secondary">{{ message }}</p>
    <a href="{{ url('index') }}" class="btn btn-sm btn-secondary">
        <i class="bi bi-arrow-return-left"></i>
        {{ error.back_home_label | default("Back home") }}
    </a>
{% endblock %}
