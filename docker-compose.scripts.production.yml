services:
  scripts-production:
    profiles:
      - production
    # Match the host user so refreshed AWS login-cache files remain host-readable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      context: ./scripts
      dockerfile: Dockerfile
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      FUNCTION_TEMPLATES_DIR: "/app/api-lambda/templates"
      HOME: "/tmp/scripts-home"
    volumes:
      - ./:/app
      # A worktree link may point outside /app; bind the shared host file here.
      - type: bind
        source: ${PROD_ENV_FILE:-./.env.prod}
        target: /app/.env.prod
        read_only: true
      - ${HOME}/.aws:/tmp/scripts-home/.aws:ro
      # AWS login refreshes its cached OAuth token during long production jobs.
      - ${HOME}/.aws/login/cache:/tmp/scripts-home/.aws/login/cache
