AWSTemplateFormatVersion: '2010-09-09'
Description: Blog infrastructure with S3, CloudFront, API Gateway, Lambda, DynamoDB, Cognito

Parameters:
  Env:
    Type: String
    Description: Environment (local or prod)
    AllowedValues:
      - local
      - prod
    Default: prod
  DomainName:
    Type: String
    Description: The domain name (e.g. blog.com)
  HostedZoneId:
    Type: String
    Description: Route 53 Hosted Zone ID for your domain
  CertificateArn:
    Type: String
    Description: ARN of the ACM certificate in us-east-1 for CloudFront
  NotificationEmail:
    Type: String
    Description: Email for contact form notifications
  NotificationPhone:
    Type: String
    Description: Phone for contact form notifications
  GoogleAnalyticsId:
    Type: String
    Description: Google Analytics tracking ID (e.g. UA-XXXXX-Y)
  GoogleOauthClientId:
    Type: String
    Description: "Google OAuth Client ID for Cognito Identity Provider"
  GoogleOauthClientSecret:
    Type: String
    Description: "Google OAuth Client Secret for Cognito Identity Provider"
    NoEcho: true
  TinyMceApiKey:
    Type: String
    Description: TinyMCE API key
  CssCacheCounter:
    Type: String
    Description: CSS file query param value
  JsCacheCounter:
    Type: String
    Description: JS file query param value
  TagProject:
    Type: String
    Description: Logical project identifier (e.g. blog)
  TagOwner:
    Type: String
    Description: Resource owner (e.g. olek)
  TagEnvironment:
    Type: String
    Description: Deployment environment (e.g. prod)
  TagRegion:
    Type: String
    Description: AWS region (e.g. us-west-2)

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-site"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "Access Identity for ${DomainName}"

  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-dynamodb-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: user_email_pk
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: post_status_pk
          AttributeType: S
        - AttributeName: post_slug
          AttributeType: S
        - AttributeName: tag_type_pk
          AttributeType: S
        - AttributeName: rating_sk
          AttributeType: N
        - AttributeName: tag_name_sk
          AttributeType: S
        - AttributeName: user_status_pk
          AttributeType: S
        - AttributeName: post_user_status_pk
          AttributeType: S
        - AttributeName: created_at_sk
          AttributeType: N
      KeySchema:
        - AttributeName: pk # e.g. "PROVIDER_USER#cognito#1", "USER#1", "POST#1", "POST_SLUG#slug1", "POST_TAG#tag1", "POST_TAG_COMBO#tag1#tag2", "CONTACT_MESSAGE#1"
          KeyType: HASH
        - AttributeName: sk # e.g. "META", "1759086095241"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: USERS_BY_EMAIL # get_user_by_user_token (get user by email)
          KeySchema:
            - AttributeName: user_email_pk # e.g. "me@example.com"
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: USERS_BY_USERNAME # get_user_by_slug (get user by username)
          KeySchema:
            - AttributeName: username # e.g. "user-123"
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: USERS_BY_STATUS_RATING # get_popular_active_users
          KeySchema:
            - AttributeName: user_status_pk # e.g. "USER#STATUS#active"
              KeyType: HASH
            - AttributeName: rating_sk # e.g. 10000001759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: POSTS_BY_STATUS_CREATED_AT # get_latest_posts
          KeySchema:
            - AttributeName: post_status_pk # e.g. "POST#STATUS#published"
              KeyType: HASH
            - AttributeName: created_at_sk # e.g. 1759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: POSTS_BY_SLUG # get_post_by_slugs
          KeySchema:
            - AttributeName: post_slug # e.g. "post-title-about-something"
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: TAGS_BY_TYPE_RATING # get_popular_post_tags
          KeySchema:
            - AttributeName: tag_type_pk # e.g. "POST_TAG"
              KeyType: HASH
            - AttributeName: rating_sk # e.g. 10000001759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: POSTS_BY_STATUS_RATING # get_popular_posts
          KeySchema:
            - AttributeName: post_status_pk # e.g. "POST#STATUS#published"
              KeyType: HASH
            - AttributeName: rating_sk # e.g. 10000001759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TAGS_BY_TYPE_NAME # get_post_tags_by_prefix
          KeySchema:
            - AttributeName: tag_type_pk # e.g. "POST_TAG"
              KeyType: HASH
            - AttributeName: tag_name_sk # e.g. "tag1"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: USERS_BY_STATUS_CREATED_AT # get_latest_active_users
          KeySchema:
            - AttributeName: user_status_pk # e.g. "USER#STATUS#active"
              KeyType: HASH
            - AttributeName: created_at_sk # e.g. 1759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: POSTS_BY_USER_STATUS_CREATED_AT # get_latest_posts_by_user
          KeySchema:
            - AttributeName: post_user_status_pk # e.g. "POST#USER#1#STATUS#published"
              KeyType: HASH
            - AttributeName: created_at_sk # e.g. 1759086095241
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Environment
          Value: !Ref TagEnvironment

  BackendFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-backend-function-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ContactFormPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !GetAtt ContactFormTopic.TopicArn
        - PolicyName: LambdaDynamoDBPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub "${DynamoDBTable.Arn}/index/*"
        - PolicyName: LambdaLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: LambdaS3Policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-backend-function"
      Description: Lambda function to serve backend requests from the API Gateway
      Role: !GetAtt BackendFunctionRole.Arn
      Handler: app.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          ENV: !Ref Env
          BASE_URL: !Sub "https://${DomainName}"
          DYNAMODB_TABLE: !Ref DynamoDBTable
          GOOGLE_ANALYTICS_ID: !Ref GoogleAnalyticsId
          TINYMCE_API_KEY: !Ref TinyMceApiKey
          CONTACT_TOPIC_ARN: !Ref ContactFormTopic
          ALLOWED_ORIGIN: !Sub "https://${DomainName}"
          COGNITO_DOMAIN: !Sub "${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
          COGNITO_CLIENT_SECRET: !GetAtt CognitoUserPoolClient.ClientSecret
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          STATIC_S3_BUCKET: !Ref SiteBucket
          CSS_CACHE_COUNTER: !Ref CssCacheCounter
          JS_CACHE_COUNTER: !Ref JsCacheCounter
      Code:
        S3Bucket: !Sub "${AWS::StackName}-code"
        S3Key: be-function.zip
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

  ApiGatewayBackendFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/*"

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      Tags:
        Environment: !Ref TagEnvironment
        Project: !Ref TagProject
        Owner: !Ref TagOwner
        Region: !Ref TagRegion

  ApiGatewayLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiGatewayDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiGatewayLambdaIntegration}"

  ApiGatewayDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: $default
      AutoDeploy: true
      Tags:
        Environment: !Ref TagEnvironment
        Project: !Ref TagProject
        Owner: !Ref TagOwner
        Region: !Ref TagRegion

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      AutoVerifiedAttributes:
        - email

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref CognitoUserPool
      ProviderDetails:
        client_id: !Ref GoogleOauthClientId
        client_secret: !Ref GoogleOauthClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        username: sub

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub "https://${DomainName}/login-callback"
        - !Sub "https://${DomainName}"
      LogoutURLs:
        - !Sub "https://${DomainName}/logout-callback"
        - !Sub "https://${DomainName}"
      SupportedIdentityProviders:
        - COGNITO
        - Google

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Domain: !Sub "${AWS::StackName}-user-pool-domain"

  # API Gateway – no caching, forward everything
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-cache-policy"
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          QueryStringsConfig:
            QueryStringBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api-origin-request-policy"
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Referer
        CookiesConfig:
          CookieBehavior: all

  # S3 static – cache aggressively, forward Origin header only
  S3CachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-s3-cache-policy"
        DefaultTTL: 86400   # 1 day
        MinTTL: 3600        # 1 hour
        MaxTTL: 31536000    # 1 year
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - "_"
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Origin
          CookiesConfig:
            CookieBehavior: none

  S3OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-s3-origin-request-policy"
        QueryStringsConfig:
          QueryStringBehavior: whitelist
          QueryStrings:
            - "_"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
        CookiesConfig:
          CookieBehavior: none


  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: [ !Ref DomainName ]
        Enabled: true
        Origins:
          - Id: s3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
          - Id: apiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: apiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [ GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS ]
          CachedMethods: [ GET, HEAD ]
          CachePolicyId: !Ref ApiCachePolicy
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        CacheBehaviors:
          - PathPattern: "/*.*"
            TargetOriginId: s3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [ GET, HEAD ]
            CachedMethods: [ GET, HEAD ]
            CachePolicyId: !Ref S3CachePolicy
            OriginRequestPolicyId: !Ref S3OriginRequestPolicy
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ContactFormTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-contact-form-topic"
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail
        - Protocol: sms
          Endpoint: !Ref NotificationPhone
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

  BackendFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BackendFunction}"
      RetentionInDays: 14
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
        - Key: Region
          Value: !Ref TagRegion

Outputs:
  WebsiteURL:
    Value: !Sub "https://${DomainName}"
    Description: URL of the deployed website
  CloudFrontDistributionId:
    Value: !GetAtt CloudFrontDistribution.Id
    Description: ID of the CloudFront distribution serving the website and API
  BackendFunctionName:
    Value: !Ref BackendFunction
    Description: Name of the backend Lambda function
  ContactFormTopicArn:
    Value: !Ref ContactFormTopic
    Description: ARN of the SNS topic used for contact form notifications
  BackendFunctionRoleName:
    Value: !Ref BackendFunctionRole
    Description: IAM Role name for the Lambda contact form handler
  BackendFunctionLogGroupName:
    Value: !Ref BackendFunctionLogGroup
    Description: CloudWatch log group for the backend Lambda
  ApiGatewayId:
    Value: !Ref ApiGateway
    Description: ID of the API Gateway for the backend
  DynamoDBTableName:
    Value: !Ref DynamoDBTable
    Description: Name of the DynamoDB table used by the backend
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
    Description: ID of the Cognito User Pool
  CognitoUserPoolClientId:
    Value: !Ref CognitoUserPoolClient
    Description: ID of the Cognito User Pool Client